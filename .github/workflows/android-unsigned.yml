name: Build unsigned Android APK

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream branch, tag, or commit
        required: false
        default: main
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/android-unsigned.yml
      - README.md
      - HANDOFF.md

permissions:
  contents: write

concurrency:
  group: android-unsigned-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        name: Checkout build wrapper

      - uses: actions/checkout@v4
        name: Checkout upstream app
        with:
          repository: alvarolorentedev/opencode-mobile
          ref: ${{ inputs.upstream_ref || 'main' }}
          path: upstream
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          ls "$ANDROID_HOME/build-tools"
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          echo "$ANDROID_HOME/build-tools/$BUILD_TOOLS" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: upstream
        run: npm ci

      - name: Generate Android project
        working-directory: upstream
        env:
          CI: '1'
          EXPO_APP_VARIANT: production
        run: npx expo prebuild --platform android --clean

      - name: Remove release signing config
        working-directory: upstream
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          lines = p.read_text().splitlines()
          kept = [line for line in lines if not re.match(r"^[ \t]*signingConfig\b", line)]
          removed = len(lines) - len(kept)
          p.write_text("\n".join(kept) + "\n")
          print(f"Removed {removed} signingConfig line(s) without changing Gradle block structure.")
          print("Generated Gradle file remains structurally intact; apksigner check enforces unsigned output.")
          PY

      - name: Build ARM64 release APK
        working-directory: upstream/android
        run: ./gradlew --no-daemon --stacktrace assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Verify unsigned APK and checksum
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p ../dist
          cp "$APK" ../dist/opencode-mobile-unsigned-arm64.apk
          if apksigner verify ../dist/opencode-mobile-unsigned-arm64.apk >/tmp/apksigner.log 2>&1; then
            echo "::error::APK unexpectedly has a valid signature"
            cat /tmp/apksigner.log
            exit 1
          fi
          zipalign -c 4 ../dist/opencode-mobile-unsigned-arm64.apk
          sha256sum ../dist/opencode-mobile-unsigned-arm64.apk | tee ../dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-mobile-unsigned-arm64
          path: |
            dist/opencode-mobile-unsigned-arm64.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-unsigned-${{ github.run_number }}
          name: OpenCode Mobile Android unsigned build ${{ github.run_number }}
          body: |
            Unsigned Android ARM64 APK built from alvarolorentedev/opencode-mobile.
            This APK cannot be installed until signed. See SHA256SUMS.txt.
          files: |
            dist/opencode-mobile-unsigned-arm64.apk
            dist/SHA256SUMS.txt
          make_latest: false
